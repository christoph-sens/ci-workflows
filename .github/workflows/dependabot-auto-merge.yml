name: Dependabot auto-merge

# Reusable: enables auto-merge (squash) for Dependabot minor/patch PRs. Call it from a pull_request
# workflow with contents: write and pull-requests: write.
# A merge done with GITHUB_TOKEN starts no workflows, so main gets no CI run and no dependency graph
# snapshot, and the next PR fails dependency review. Pass merge-token (stored as a Dependabot secret,
# because runs started by Dependabot only see those) to merge as a user whose push starts CI.
on:
  workflow_call:
    secrets:
      merge-token:
        description: Token that enables auto-merge, so that the merge starts the push workflows (contents and pull requests read/write)
        required: false

permissions: {}

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      # Major updates stay manual; minor/patch merge automatically once CI is green.
      - if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: |
          if [ -z "$MERGE_TOKEN" ]; then
            echo "::warning::No merge-token: the merge will start no CI run on the default branch."
          fi
          GH_TOKEN="${MERGE_TOKEN:-$GITHUB_TOKEN}" gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          MERGE_TOKEN: ${{ secrets.merge-token }}
          GITHUB_TOKEN: ${{ github.token }}
