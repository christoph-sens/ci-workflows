name: Gradle CI

# Reusable CI for the Kotlin/Gradle repos: build + tests, optional integration tests, optional Docker
# image with Trivy scan, CodeQL for the code and the workflows, and Gradle dependency submission.
on:
  workflow_call:
    inputs:
      java-version:
        description: Temurin JDK version.
        type: string
        default: "25"
      gradle-tasks:
        description: Gradle tasks of the main build step.
        type: string
        default: build
      integration-tests:
        description: Run `./gradlew integrationTest` and compile the integrationTest source set for CodeQL.
        type: boolean
        default: false
      docker-jar-dir:
        description: >-
          Directory of the boot jar produced by gradle-tasks. When set, the Dockerfile's `prebuilt` target
          is built with this directory as build context `app` and the image is scanned with Trivy.
        type: string
        default: ""

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Build
        run: |
          read -ra tasks <<< "$GRADLE_TASKS"
          ./gradlew "${tasks[@]}"
        env:
          GRADLE_TASKS: ${{ inputs.gradle-tasks }}
      - name: Integration tests
        if: inputs.integration-tests
        run: ./gradlew integrationTest
      - name: Build Docker image
        if: inputs.docker-jar-dir != ''
        # Packages the jar built and tested above instead of compiling again inside Docker.
        run: docker build --target prebuilt --build-context "app=$JAR_DIR" -t ci-image:ci .
        env:
          JAR_DIR: ${{ inputs.docker-jar-dir }}
      # Scans the image (base OS packages and the bundled jars) for known vulnerabilities that have a fix.
      # Results go to Code Scanning (category trivy).
      - name: Scan Docker image
        if: inputs.docker-jar-dir != ''
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ci-image:ci
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - name: Upload image scan results
        if: ${{ !cancelled() && inputs.docker-jar-dir != '' && hashFiles('trivy-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-results.sarif
          category: trivy
      - name: Test summary
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6.5.0
        with:
          report_paths: '**/build/test-results/**/*.xml'
          annotate_only: true
          detailed_summary: true
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: '**/build/reports/'
          retention-days: 7

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended
      # CodeQL must observe real compilation: bypass the build cache and compile Kotlin in-process.
      - name: Compile
        run: ./gradlew assemble testClasses ${EXTRA_TASKS:+"$EXTRA_TASKS"} --no-build-cache --no-daemon -Pkotlin.compiler.execution.strategy=in-process
        env:
          EXTRA_TASKS: ${{ inputs.integration-tests && 'integrationTestClasses' || '' }}
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:java-kotlin

  # Scans the workflow files themselves (e.g. script injection via ${{ }} in run:, overly broad permissions).
  codeql-actions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: actions
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:actions

  # Sends the resolved Gradle dependency tree to GitHub's dependency graph so Dependabot alerts
  # and security updates cover Maven dependencies (GitHub cannot resolve them statically). On pull
  # requests it provides the snapshot for dependency-review; fork PRs are skipped (no write token).
  # Keep the job id: together with the caller's workflow name it forms the snapshot correlator.
  dependency-submission:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
      - uses: gradle/actions/dependency-submission@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

  # Blocks pull requests that add or update dependencies with known high/critical vulnerabilities or
  # licenses outside the allow-list (permissive and weak copyleft; no GPL/AGPL/SSPL/BUSL). Packages
  # with missing or unusable license data in GitHub's database are excluded from the license check.
  dependency-review:
    if: github.event_name == 'pull_request'
    needs: dependency-submission
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 120
          allow-licenses: >-
            0BSD, Apache-1.1, Apache-2.0, BSD-2-Clause, BSD-3-Clause, BSL-1.0, CC0-1.0,
            CDDL-1.0, CDDL-1.1, EPL-1.0, EPL-2.0, ISC, LGPL-2.1, LGPL-2.1-only, LGPL-2.1-or-later,
            LGPL-3.0-only, LGPL-3.0-or-later, MIT, MIT-0, MPL-2.0, Unicode-3.0, Unicode-DFS-2016,
            Zlib, GPL-2.0-only WITH Classpath-exception-2.0
          allow-dependencies-licenses: >-
            pkg:maven/org.bouncycastle/bc-jdk18on-bom, pkg:maven/org.bouncycastle/bcpg-jdk18on,
            pkg:maven/org.bouncycastle/bcpkix-jdk18on, pkg:maven/org.bouncycastle/bcprov-jdk18on,
            pkg:maven/org.bouncycastle/bcutil-jdk18on, pkg:maven/org.junit/junit-bom,
            pkg:maven/com.tngtech.archunit/archunit, pkg:maven/org.eclipse.jetty/jetty-bom,
            pkg:maven/org.eclipse.jetty.ee11/jetty-ee11-bom, pkg:maven/ch.qos.logback/logback-parent,
            pkg:maven/org.glassfish.jaxb/jaxb-core, pkg:maven/org.glassfish.jaxb/jaxb-runtime,
            pkg:maven/org.glassfish.jaxb/txw2, pkg:maven/jakarta.xml.bind/jakarta.xml.bind-api,
            pkg:maven/org.eclipse.angus/angus-activation, pkg:maven/org.eclipse.ee4j/project,
            pkg:maven/org.springframework.session/spring-session-bom, pkg:maven/com.github.librepdf/openpdf
