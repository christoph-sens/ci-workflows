name: Node CI

# Reusable CI for the Node/npm repos (e.g. the Astro website): clean install from the lockfile,
# npm scripts (type check + build), CodeQL for the code and the workflows, dependency review on pull
# requests. GitHub reads package-lock.json natively, so no dependency submission is needed.
on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version for actions/setup-node.
        type: string
        default: "24"
      npm-scripts:
        description: npm scripts run in order after `npm ci`, space-separated.
        type: string
        default: check build

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Run npm scripts
        run: |
          read -ra scripts <<< "$NPM_SCRIPTS"
          for script in "${scripts[@]}"; do
            echo "::group::npm run $script"
            npm run "$script"
            echo "::endgroup::"
          done
        env:
          NPM_SCRIPTS: ${{ inputs.npm-scripts }}

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:javascript-typescript

  # Scans the workflow files themselves (e.g. script injection via ${{ }} in run:, overly broad permissions).
  codeql-actions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: actions
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:actions

  # Blocks pull requests that add or update dependencies with known high/critical vulnerabilities or
  # licenses outside the allow-list. Same policy as gradle-ci.yml, plus the permissive licenses common
  # in npm: OFL-1.1 (web fonts), BlueOak-1.0.0 and Python-2.0.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          allow-licenses: >-
            0BSD, Apache-1.1, Apache-2.0, BlueOak-1.0.0, BSD-2-Clause, BSD-3-Clause, BSL-1.0, CC0-1.0,
            CDDL-1.0, CDDL-1.1, EPL-1.0, EPL-2.0, ISC, LGPL-2.1, LGPL-2.1-only, LGPL-2.1-or-later,
            LGPL-3.0-only, LGPL-3.0-or-later, MIT, MIT-0, MPL-2.0, OFL-1.1, Python-2.0, Unicode-3.0,
            Unicode-DFS-2016, Zlib, GPL-2.0-only WITH Classpath-exception-2.0
