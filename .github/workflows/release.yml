name: Release

# Every change to a reusable workflow on main becomes a release, so Dependabot proposes it in the
# calling repos: patch by default, minor/major when the merged pull request carries the label
# `release:minor` / `release:major` (new features / breaking changes). A manual run picks the bump.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/gradle-ci.yml
      - .github/workflows/dependabot-auto-merge.yml
      - .github/workflows/container-release.yml
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to increase
        type: choice
        options: [patch, minor, major]
        default: minor

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read # labels of the merged pull request
    steps:
      - name: Create release
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            labels=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '[.[].labels[].name] | join(" ")')
            case " $labels " in
              *" release:major "*) BUMP=major ;;
              *" release:minor "*) BUMP=minor ;;
            esac
          fi
          latest=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // ""')
          if [[ -z "$latest" ]]; then
            next=v1.0.0
          else
            IFS=. read -r major minor patch <<< "${latest#v}"
            case "$BUMP" in
              major) next="v$((major + 1)).0.0" ;;
              minor) next="v$major.$((minor + 1)).0" ;;
              *)     next="v$major.$minor.$((patch + 1))" ;;
            esac
          fi
          gh release create "$next" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
          GH_TOKEN: ${{ github.token }}
